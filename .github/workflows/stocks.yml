name: Cập nhật giá VN100

# Cào nến ngày VN100 (VN30 + VN70) + VN-Index sau phiên ATC (14:45 giờ VN) rồi commit data/vn100.json để GitHub Pages phục vụ cùng origin.
# 08:40 UTC = 15:40 giờ Việt Nam, thứ Hai → thứ Sáu. Bấm "Run workflow" để chạy tay bất kỳ lúc nào.
on:
  schedule:
    - cron: '40 8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write        # để gọi API "request Pages build" sau khi commit (audit F11: push bằng GITHUB_TOKEN không chắc tự kích Pages)

concurrency:
  group: stocks-data
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cào dữ liệu
        run: node scripts/crawl-stocks.mjs
      - name: Commit nếu có thay đổi
        id: commit
        run: |
          git config user.name "fintrace-bot"
          git config user.email "fintrace-bot@users.noreply.github.com"
          git add data/vn100.json
          if git diff --cached --quiet; then echo "Không có thay đổi."; echo "pushed=0" >> "$GITHUB_OUTPUT"; else
            git commit -m "data: giá VN100 $(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d\ %H:%M)"
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      # Push bằng GITHUB_TOKEN không được GitHub bảo đảm sẽ kích Pages build (audit F11). Gọi thẳng API "request a Pages build" cho chắc;
      # lỗi ở bước này không làm run đỏ (Pages có thể đã tự build).
      - name: Yêu cầu GitHub Pages build lại
        if: steps.commit.outputs.pushed == '1'
        run: |
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "000")
          echo "Pages build request: HTTP $code"; head -c 300 /tmp/pages.json || true; echo
      - name: Kiểm tra kho trên Pages đã mới (chờ tối đa 3 phút)
        if: steps.commit.outputs.pushed == '1'
        run: |
          want=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/vn100.json','utf8')).updatedAt)")
          for i in $(seq 1 18); do
            got=$(curl -sS "https://hoangvinhkta-creator.github.io/Finance/data/vn100.json?nocache=$RANDOM" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).updatedAt)}catch(e){console.log('parse-error')}})" || echo "fetch-error")
            if [ "$got" = "$want" ]; then echo "Pages đã phục vụ kho mới (updatedAt=$got) sau $((i*10)) giây."; exit 0; fi
            sleep 10
          done
          echo "::warning::Sau 3 phút Pages vẫn phục vụ kho cũ (updatedAt=$got, cần $want) — kiểm tra Settings → Pages."
